info:
  name: Create comment
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:{{PRISMA_API_PORT}}/comments
  auth: inherit

headers:
  Content-Type: application/json

body:
  mimeType: application/json
  text: |
    {
      "content": "Comentario Prisma",
      "postId": {{POST_ID}},
      "authorId": {{USER_ID}}
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5