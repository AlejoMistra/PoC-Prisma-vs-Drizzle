info:
  name: Create user
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:{{PRISMA_API_PORT}}/users
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Juan Gomez",
        "email": "JuanGomez@gmail.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
