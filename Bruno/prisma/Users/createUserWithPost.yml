info:
  name: Create user with post
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:{{PRISMA_API_PORT}}/users/with-post
  body:
    type: json
    data: |-
      {
        "name": "Martin Sanchez",
        "email": "sanchezMartin@hotmail.com",
        "post": {
          "title": "Mi primer post usando la API de Prisma",
          "content": "Estoy aprendiendo a usar Prisma y me parece una herramienta muy útil para interactuar con la base de datos de manera más sencilla y segura"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
