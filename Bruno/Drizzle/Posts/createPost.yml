info:
  name: Create post
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{DRIZZLE_API_PORT}}/posts
  body:
    type: json
    data: |-
      {
        "title": "Me gusta el control que permite Drizzle",
        "content": "Drizzle permite un control más fino sobre las relaciones y consultas, lo que lo hace ideal para proyectos que requieren un ORM más cercano a SQL",
        "authorId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
